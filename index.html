</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'Rs. '+Number(n).toLocaleString('en-PK');
const store={get(k,d){try{const v=localStorage.getItem('pbs2_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pbs2_'+k,JSON.stringify(v));return true}catch(e){toast('Storage is full. Use a smaller image.','err');return false}}};
const hs=s=>{let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return String(h>>>0)};
const I=(d,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic={search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',up:'<path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/>',chk:'<path d="m5 12 5 5 9-10"/>',truck:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',wa:'<path d="M3 21l1.6-5A8 8 0 1 1 8 19.4z"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',plus:'<path d="M12 5v14M5 12h14"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>'};
const crest='<svg viewBox="0 0 40 46" width="28" height="32"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D061"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#AA771C"/></linearGradient></defs><path d="M20 2 36 8v14c0 11-7 19-16 22C11 41 4 33 4 22V8z" fill="none" stroke="url(#cg)" stroke-width="1.6"/><path d="M20 5 33 10v12c0 9-6 16-13 19" fill="none" stroke="url(#cg)" stroke-opacity=".4"/><text x="20" y="29" text-anchor="middle" font-family="Cinzel,serif" font-size="19" font-weight="700" fill="url(#cg)">P</text></svg>';
const SEED=[
{id:'p1',title:'Noir Chronograph Watch',cat:'Watches',price:45000,stock:4,rating:4.9,tag:'Limited Edition',best:1,dim:'42 mm case · 20 mm strap',desc:'Brushed black steel case with gold-tone detailing.',img:''},
{id:'p2',title:'Aurum Silk Scarf',cat:'Accessories',price:12500,stock:15,rating:4.7,tag:'',best:0,dim:'90 × 90 cm',desc:'Hand-rolled pure silk with a woven gold thread border.',img:''},
{id:'p3',title:'Sovereign Oud Perfume',cat:'Fragrance',price:18900,stock:20,rating:4.8,tag:'Exclusive',best:1,dim:'100 ml crystal flacon',desc:'Deep oud, amber and saffron with a long, warm dry-down.',img:''},
{id:'p4',title:'Onyx Cufflink Set',cat:'Jewelry',price:22000,stock:10,rating:4.6,tag:'',best:0,dim:'16 mm face',desc:'Polished onyx set in 18k gold-plated settings.',img:''},
{id:'p5',title:'Heritage Leather Wallet',cat:'Leather',price:15500,stock:25,rating:4.8,tag:'',best:1,dim:'11 × 9 cm · 8 card slots',desc:'Full-grain black leather with gold-stamped edges.',img:''},
{id:'p6',title:'Gilded Aviator Shades',cat:'Eyewear',price:27500,stock:3,rating:4.5,tag:'Exclusive',best:0,dim:'145 mm frame width',desc:'Lightweight frames with smoked lenses and gold temples.',img:''}];
const STAT=['Pending Verification','Processing','Out for Delivery','Completed'];
let S={products:store.get('products',SEED),users:store.get('users',[]),orders:store.get('orders',[]),carts:store.get('carts',{}),uid:store.get('uid',null),set:store.get('set',{name:'Siddique Admin',num:'03XX-XXXXXXX'})};
let M=null,AT='dash',F='all',OF='All',PF='Pending';S.set.platform=S.set.platform||'Easypaisa';S.admins=store.get('admins',[]);const PLAT=['Easypaisa','JazzCash','NayaPay','SadaPay'];
const save=k=>store.set(k,S[k]),me=()=>S.users.find(u=>u.id===S.uid),ck=()=>S.uid||'guest',cart=()=>S.carts[ck()]||(S.carts[ck()]={}),prod=id=>S.products.find(p=>p.id===id);
const cartCount=()=>Object.values(cart()).reduce((a,b)=>a+b,0);
const isPaid=o=>o.pay==='ep'?o.verified:o.status==='Completed';
const wa=n=>{let d=String(n).replace(/\D/g,'');if(d[0]==='0')d='92'+d.slice(1);return d};
const art=p=>p.img||('data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="a" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#2d2616"/><stop offset="1" stop-color="#09090b"/></radialGradient><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F5D061"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#AA771C"/></linearGradient></defs><rect width="400" height="400" fill="url(#a)"/><circle cx="200" cy="185" r="88" fill="none" stroke="url(#g)" stroke-width="2"/><circle cx="200" cy="185" r="72" fill="none" stroke="#D4AF37" stroke-opacity=".3"/><text x="200" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="76" fill="url(#g)">'+esc(p.title[0])+'</text><text x="200" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="14" letter-spacing="6" fill="#D4AF37">'+esc(p.cat.toUpperCase())+'</text></svg>'));
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
const fl=(id,l,v,a)=>`<div class="fl"><input id="${id}" placeholder=" " value="${esc(v||'')}" ${a||''}><label for="${id}">${l}</label></div>`;
function toast(m,t){const d=document.createElement('div');d.className='t '+(t||'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function squash(f,max,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};i.onerror=()=>toast('That file is not a valid image.','err');i.src=r.result};r.readAsDataURL(f)}
const openM=m=>{M=m;drawM()},closeM=()=>{M=null;drawM()};

/* ---------- storefront ---------- */
function draw(){const a=location.hash==='#admin';$('#app').innerHTML=a?admin():header()+shop();drawM()}
function show(f){F=f;if(location.hash)location.hash='';else draw();setTimeout(()=>{const e=$('#collection');e&&e.scrollIntoView()},60)}
function header(){const u=me(),n=cartCount();return `<header class="glass cap"><div class="brand" onclick="F='all';location.hash?location.hash='':draw();scrollTo(0,0)">${I(ic.crown,18)}<span class="serif">Premium by Siddique</span></div>
<div class="links"><a onclick="show('all')">Collections</a><a onclick="openM({t:'trk'})">Orders</a><a onclick="openM({t:'ct'})">Contact</a></div>
<nav><button class="ib" aria-label="Search" onclick="openM({t:'srch'})">${I(ic.search)}</button>
<button class="cartp" aria-label="Cart" onclick="openCo(null)">${I(ic.bag,16)}<span>Cart</span>${n?`<span class="cc">${n}</span>`:''}</button>

<button class="ib" aria-label="Account" onclick="${u?"openM({t:'acct'})":"openM({t:'auth',mode:'in'})"}">${I(ic.user)}${u?`<span style="font-size:12px;color:var(--tx)">${esc(u.name.split(' ')[0])}</span>`:''}</button></nav></header>`}
function shop(){const l=S.products.filter(p=>F==='best'?p.best:1);return `<div class="hero"><div class="hc"><span class="tagp">Luxury Collection 2026</span><h1 class="serif">Premium by Siddique — <span class="gold">Engineered Elegance.</span></h1><p>Hand-finished pieces in black, leather and gold, couriered across Pakistan.</p><div class="ctas"><button class="solid" onclick="show('all')">Shop the Collection</button><button class="fbtn" onclick="show('best')">View Best Sellers</button></div></div></div>
<section id="collection"><div class="head"><span class="tagp">Collection</span><h2 class="serif">${F==='best'?'Best Sellers':'The Collection'}</h2></div>
<div class="chips"><button class="${F==='all'?'on':''}" onclick="show('all')">All pieces</button><button class="${F==='best'?'on':''}" onclick="show('best')">Best sellers</button><button onclick="openM({t:'trk'})">Track order</button></div>
<div class="grid">${l.map(card).join('')||'<p class="hint">No products yet.</p>'}</div></section>
<footer>Premium by Siddique · Cash on Delivery and Easypaisa · Delivery in 3 to 4 working days</footer>`}
const bdg=p=>{const a=[];if(p.stock<1)a.push('Sold Out');else if(p.stock<=5)a.push('Limited Stock');if(p.tag)a.push(p.tag);return a.length?`<div class="bd">${a.map(t=>`<span class="pillb">${esc(t)}</span>`).join('')}</div>`:''};
function card(p){return `<div class="card glass"><div class="pimg">${bdg(p)}<img src="${art(p)}" alt="${esc(p.title)}"><button class="qv" onclick="openM({t:'qv',id:'${p.id}'})">${I(ic.eye,15)} Quick view</button></div>
<div class="pb"><span class="cat">${esc(p.cat)}</span><h3 class="serif">${esc(p.title)}</h3><div class="row"><span class="price">${fmt(p.price)}</span><span class="stars">${stars(p.rating)}</span></div>
${p.stock<1?'<div class="oos">Out of stock</div>':`<div class="acts"><button onclick="add('${p.id}')">Add to Cart</button><button class="solid" onclick="buyNow('${p.id}')">Buy Now</button></div>`}</div></div>`}
function add(id){const p=prod(id),c=cart(),n=(c[id]||0)+1;if(n>p.stock){toast('Only '+p.stock+' left in stock.','err');return}c[id]=n;save('carts');draw();toast(p.title+' added to cart')}
function openCo(buy){openM({t:'co',step:1,buy,pay:'cod',proof:'',f:{},pm:{amt:'',num:'',nm:''}})}
function buyNow(id){openCo([{id,q:1}])}

/* ---------- auth ---------- */
function authGo(){const mode=M.mode,e=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value;
 if(!/^\S+@\S+\.\S+$/.test(e)){toast('Enter a valid email address.','err');return}
 if(pw.length<6){toast('Password must be at least 6 characters.','err');return}
 let u=S.users.find(x=>x.email===e);
 if(mode==='up'){const n=$('#an').value.trim();if(!n){toast('Enter your full name.','err');return}if(u){toast('That email is already registered. Sign in instead.','err');return}u={id:'u'+Date.now(),name:n,email:e,pw:hs(pw),role:'user'};S.users.push(u);save('users')}
 else if(!u||u.pw!==hs(pw)){toast('Email or password is incorrect.','err');return}
 const g=S.carts.guest||{};if(Object.keys(g).length){S.carts[u.id]=S.carts[u.id]||{};for(const k in g)S.carts[u.id][k]=(S.carts[u.id][k]||0)+g[k];delete S.carts.guest;save('carts')}
 S.uid=u.id;store.set('uid',u.id);const nx=M.next;M=null;draw();toast(mode==='up'?'Account created. Welcome, '+u.name.split(' ')[0]:'Signed in');if(nx)nx()}
function googleGo(){toast('Google sign-in is not available yet. Please continue with your email.')}
function logout(){S.uid=null;store.set('uid',null);M=null;if(location.hash==='#admin')location.hash='';draw();toast('Signed out')}

/* ---------- checkout ---------- */
const coItems=()=>M.buy||Object.entries(cart()).filter(([id])=>prod(id)).map(([id,q])=>({id,q}));
function setQ(id,d){const p=prod(id),it=M.buy?M.buy.find(x=>x.id===id):null,n=(it?it.q:cart()[id])+d;
 if(n>p.stock){toast('Only '+p.stock+' left in stock.','err');return}
 if(M.buy){if(n<1)M.buy=M.buy.filter(x=>x.id!==id);else it.q=n}else{if(n<1)delete cart()[id];else cart()[id]=n;save('carts')}draw()}
const readF=()=>{const g=id=>($('#'+id)?$('#'+id).value.trim():'');return{name:g('fn'),phone:g('fp'),wa:g('fw'),city:g('fc'),addr:g('fa'),zip:g('fz')}};
function step(n){if(n===3||n===1){if($('#fn')){const f=readF();if(n===3){for(const [k,l] of [['name','full name'],['phone','phone number'],['wa','WhatsApp number'],['city','city'],['addr','house and street address'],['zip','postal code']])if(!f[k]){toast('Enter your '+l+'.','err');return}}M.f=f}}
 else if($('#fn'))M.f=readF();
 if(n===2&&!S.uid){const keep=M;toast('Sign in to continue to checkout');openM({t:'auth',mode:'in',next:()=>{M=keep;M.step=2;M.an=1;drawM()}});return}
 M.step=n;M.an=1;drawM()}
function sumBox(sub){return `<div class="sum"><div class="row"><span>Subtotal</span><span>${fmt(sub)}</span></div><div class="row"><span>Delivery</span><span>${fmt(200)}</span></div><div class="row tot"><span>Grand total</span><span>${fmt(sub+200)}</span></div><div class="pillb" style="display:block;text-align:center;margin-top:12px;text-transform:none;letter-spacing:.02em">Delivery within 3 to 4 working days across Pakistan.</div></div>`}
function co(){const it=coItems(),sub=it.reduce((a,i)=>a+prod(i.id).price*i.q,0),s=M.step,u=me(),f=Object.assign({},u&&u.addr||{},Object.fromEntries(Object.entries(M.f||{}).filter(([k,v])=>v)));let b;
 const dots=['Cart','Details','Payment'].map((l,i)=>`<span class="sd ${s>i?'on':''}">${l}</span>`).join('');
 if(!it.length)b='<p class="hint" style="margin:24px 0">Your cart is empty. Add a piece from the collection.</p>';
 else if(s===1)b=it.map(i=>{const p=prod(i.id);return `<div class="ci"><img src="${art(p)}" alt=""><div><div>${esc(p.title)}</div><div class="price">${fmt(p.price*i.q)}</div></div><div class="q"><button onclick="setQ('${p.id}',-1)" aria-label="Decrease">−</button>${i.q}<button onclick="setQ('${p.id}',1)" aria-label="Increase">+</button></div></div>`}).join('')+sumBox(sub)+`<button class="solid" style="width:100%;padding:14px" onclick="step(2)">Continue to details</button>`;
 else if(s===2)b=fl('fn','Full name',f.name||(u&&u.name),'autocomplete="name"')+`<div class="two">${fl('fp','Phone number',f.phone,'type="tel"')}${fl('fw','WhatsApp number',f.wa,'type="tel"')}</div><div class="two">${fl('fc','City',f.city,'list="cities"')}${fl('fz','Postal / ZIP code',f.zip,'inputmode="numeric"')}</div><datalist id="cities">${['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Vehari','Burewala','Peshawar','Quetta','Sialkot'].map(c=>`<option>${c}</option>`).join('')}</datalist>${fl('fa','House address and street line 1',f.addr,'autocomplete="street-address"')}
  <div class="row" style="margin-top:22px;gap:10px"><button onclick="step(1)">Back</button><button class="solid" style="flex:1;padding:14px" onclick="step(3)">Continue to payment</button></div>`;
 else b=sumBox(sub)+`<div class="pay"><button class="${M.pay==='cod'?'on':''}" data-v="cod" onclick="setPay('cod')">Cash on Delivery</button><button class="${M.pay==='ep'?'on':''}" data-v="ep" onclick="setPay('ep')">Online · ${esc(S.set.platform)}</button></div>
  <div class="note" id="codn" style="display:${M.pay==='cod'?'block':'none'}">Pay in cash upon doorstep delivery.</div>
  <div class="ep" id="epn" style="display:${M.pay==='ep'?'block':'none'}"><span class="pillb">${esc(S.set.platform)}</span><div class="hint" style="margin-top:10px">Transfer exactly <b style="color:var(--g1)">${fmt(sub+200)}</b> to:</div><div style="margin-top:8px">Account title: <b>${esc(S.set.name)}</b></div><div style="margin-top:4px">Account number: <b>${esc(S.set.num)}</b><button class="chip" onclick="copyNum()">${I(ic.copy,13)} Copy</button></div>
  ${fl('pa','Amount sent (PKR)',M.pm.amt,'type="number" min="0" inputmode="numeric" oninput="M.pm.amt=this.value"')}<div class="two">${fl('pn','Sender mobile number',M.pm.num,'type="tel" oninput="M.pm.num=this.value"')}${fl('pq','Sender name / title',M.pm.nm,'oninput="M.pm.nm=this.value"')}</div>
  <div class="drop" id="dz" ondragover="event.preventDefault();this.classList.add('hv')" ondragleave="this.classList.remove('hv')" ondrop="event.preventDefault();this.classList.remove('hv');getProof(event.dataTransfer.files[0])" onclick="$('#pf').click()">${proofView()}</div><input id="pf" type="file" accept="image/*" hidden onchange="getProof(this.files[0])"></div>
  <div class="row" style="margin-top:22px;gap:10px"><button onclick="step(2)">Back</button><button class="solid" style="flex:1;padding:14px" onclick="placeOrder()">Place order</button></div>`;
 return `<h2 class="gold serif">Checkout</h2><div class="sdots">${dots}</div><div class="${M.an?'stp':''}">${b}</div>`}
function proofView(){return M.proof?`<img src="${M.proof}" alt="Payment screenshot preview"><button onclick="event.stopPropagation();$('#pf').click()">Replace</button> <button onclick="event.stopPropagation();M.proof='';$('#dz').innerHTML=proofView()">Clear</button>`:`${I(ic.up,26)}<div style="margin-top:6px">Drag and drop your payment screenshot, or tap to upload</div>`}
function getProof(f){squash(f,1100,d=>{M.proof=d;$('#dz').innerHTML=proofView()})}
function setPay(v){M.pay=v;$('#codn').style.display=v==='cod'?'block':'none';$('#epn').style.display=v==='ep'?'block':'none';document.querySelectorAll('.pay button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function copyNum(){const t=S.set.num,ok=()=>toast('Number copied'),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():toast('Select the number to copy it.','err')}catch(e){toast('Select the number to copy it.','err')}a.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function placeOrder(){
 const items=coItems().map(i=>{const p=prod(i.id);return{id:p.id,title:p.title,price:p.price,q:i.q}});if(!items.length)return;
 if(M.pay==='ep'){const q=M.pm;if(!(+q.amt>0)){toast('Enter the amount you sent.','err');return}if(!q.num.trim()){toast('Enter the sender mobile number.','err');return}if(!q.nm.trim()){toast('Enter the sender name.','err');return}if(!M.proof){toast('Upload your payment screenshot.','err');return}}
 for(const i of items)if(prod(i.id).stock<i.q){toast(i.title+' is no longer available in that quantity.','err');return}
 let id;do{id='PBS-'+(1000+Math.floor(Math.random()*9000))}while(S.orders.some(o=>o.id===id));
 const sub=items.reduce((a,i)=>a+i.price*i.q,0),o={id,uid:S.uid,items,sub,ship:200,total:sub+200,f:M.f,pay:M.pay,email:(me()||{}).email||'',pm:M.pay==='ep'?{platform:S.set.platform,amt:+M.pm.amt,num:M.pm.num.trim(),nm:M.pm.nm.trim()}:null,proof:M.pay==='ep'?M.proof:'',status:STAT[0],verified:false,date:new Date().toISOString()};const uu=me();if(uu){uu.addr=M.f;save('users')}
 S.orders.unshift(o);if(!save('orders')){S.orders.shift();return}

<div class="meta"><span>Customer: <b>${esc(o.f.name)}</b></span><span>Email: <b>${esc(em)}</b></span><span>WhatsApp: <b>${esc(o.f.wa)}</b></span><span>Items: <b>${o.items.map(i=>esc(i.title)+' × '+i.q).join(', ')}</b></span><span>Amount paid: <b>${pm.amt!=null?fmt(pm.amt):'—'}</b> · Order total ${fmt(o.total)}</span><span>Sender mobile: <b>${esc(pm.num||'—')}</b></span><span>Sender name: <b>${esc(pm.nm||'—')}</b></span></div>
${pm.amt!=null&&pm.amt!==o.total?'<div class="note">The amount paid does not match the order total. Check the receipt before you approve.</div>':''}${st==='Rejected'&&o.rejReason?`<div class="hint">Rejected: ${esc(o.rejReason)}</div>`:''}
<div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px"><span class="pill ${st==='Approved'?'cod':'onl'}">${st.toUpperCase()}</span><span style="display:flex;gap:8px;flex-wrap:wrap">${o.proof?`<button onclick="openM({t:'img',src:S.orders.find(x=>x.id==='${o.id}').proof})">View proof</button>`:''}${st==='Pending'?`<button class="solid" onclick="approve('${o.id}')">Approve Payment</button><button class="danger" onclick="openM({t:'rej',id:'${o.id}'})">Reject Payment</button>`:''}</span></div></div>`};
function approve(id){const o=S.orders.find(x=>x.id===id);o.verified=true;o.payState='approved';delete o.rejReason;if(o.status===STAT[0]||o.status==='Payment Rejected')o.status=STAT[1];save('orders');draw();toast('Payment approved for #'+id)}
function doReject(id){const o=S.orders.find(x=>x.id===id),t=$('#rt').value,n=$('#rn').value.trim();o.payState='rejected';o.verified=false;o.rejReason=t+(n?': '+n:'');o.status='Payment Rejected';save('orders');M=null;draw();toast('Payment rejected for #'+id)}
function addAdmin(){const e=$('#na').value.trim().toLowerCase(),p=$('#np').value;
 if(!/^[^\s'"<>\\]+@[^\s'"<>\\]+\.[^\s'"<>\\]+$/.test(e)){toast('Enter a valid admin email.','err');return}
 if(p.length<6){toast('Admin password must be at least 6 characters.','err');return}
 if(hs(e)===AE||S.admins.some(a=>a.email===e)){toast('That email already has admin access.','err');return}
 S.admins.push({email:e,pw:hs(p),date:new Date().toISOString()});save('admins');draw();toast('New admin created: '+e)}
function delAdmin(e){S.admins=S.admins.filter(a=>a.email!==e);save('admins');M=null;draw();toast('Admin access revoked')}
addEventListener('hashchange',()=>{M=null;draw()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});
addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});
draw();
</script></body></html>
